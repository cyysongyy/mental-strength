<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#7c3aed" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <title>心理肌肉鍛鍊 Mental Muscle Training</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        // Runs immediately as the parser reaches this point - deliberately
        // not gated on window.load, since that also waits on unrelated
        // third-party resources (e.g. the Google Fonts link above) and
        // would delay detecting a real mount failure.
        //
        // On a weak/slow mobile connection, fetching+parsing the JS bundle
        // can genuinely take many seconds. Rather than guess a fixed
        // timeout, poll and only act once the browser itself reports the
        // page finished loading (document.readyState === "complete") -
        // plus a hard cap as a safety net in case that never fires. Acting
        // too early on a page that's simply still loading only makes a
        // slow connection slower by restarting the download.
        var HARD_CAP_MS = 20000;
        var POLL_INTERVAL_MS = 500;
        var RETRY_KEY = "ms_reload_retry";
        var startedAt = Date.now();

        // A React render error with no error boundary above it unmounts the
        // whole tree, leaving #root empty just like a failed script load -
        // so the fallback below has no way to tell those apart on its own.
        // Record the first real error/rejection here so that if the
        // fallback does end up showing, it can display what actually broke
        // instead of a generic message.
        var lastError = "";
        window.addEventListener("error", function (e) {
          if (!lastError && e && e.message) lastError = e.message;
        });
        // A failed <script>/<link> load fires an "error" event that carries no
        // .message and does not bubble, so the listener above never sees it -
        // which is how a stale index.html pointing at a deleted asset produced
        // a fallback screen with no explanation at all. Catch those in the
        // capture phase and record which URL actually failed.
        // Track a failed script separately from any other failed resource: an
        // optional stylesheet (the Google Fonts link) failing is cosmetic and
        // must not mask the script failure that actually left the page blank.
        var failedScript = "";
        var failedResource = "";
        window.addEventListener(
          "error",
          function (e) {
            var el = e && e.target;
            if (!el || el === window) return;
            var src = el.src || el.href;
            if (!src) return;
            var name = String(src).split("/").pop();
            if (el.tagName === "SCRIPT") {
              if (!failedScript) failedScript = name;
            } else if (!failedResource) {
              failedResource = name;
            }
          },
          true,
        );
        window.addEventListener("unhandledrejection", function (e) {
          if (!lastError) {
            var reason = e && e.reason;
            lastError = (reason && (reason.message || String(reason))) || "unhandled rejection";
          }
        });
        function isBlank() {
          var root = document.getElementById("root");
          return !root || root.childElementCount === 0;
        }
        function check() {
          var pageStillLoading =
            document.readyState !== "complete" && Date.now() - startedAt < HARD_CAP_MS;
          if (pageStillLoading) {
            setTimeout(check, POLL_INTERVAL_MS);
            return;
          }
          if (!isBlank()) {
            sessionStorage.removeItem(RETRY_KEY);
            return;
          }
          if (!sessionStorage.getItem(RETRY_KEY)) {
            // First failure: assume a stale cached page pointing at
            // deleted build assets, and force one genuinely fresh fetch.
            sessionStorage.setItem(RETRY_KEY, "1");
            location.replace(
              location.pathname + "?_r=" + Date.now() + location.hash,
            );
            return;
          }
          // Still blank after a fresh fetch: show a manual recovery UI
          // instead of leaving a permanently white screen. Include any
          // captured error text so a screenshot of this screen is actually
          // diagnosable instead of just saying "something went wrong".
          var root = document.getElementById("root");
          if (root) {
            var detail = failedScript
              ? "載入失敗：" + failedScript
              : lastError || (failedResource ? "載入失敗：" + failedResource : "");
            root.innerHTML =
              '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;font-family:system-ui,-apple-system,sans-serif;padding:24px;text-align:center;background:#f6f7fb;color:#334155;">' +
              "<p>頁面載入異常，請重新整理</p>" +
              (detail
                ? '<p style="font-size:12px;color:#94a3b8;max-width:320px;word-break:break-all;">' +
                  detail.replace(/</g, "&lt;") +
                  "</p>"
                : "") +
              '<button id="ms-retry" style="padding:10px 24px;border-radius:12px;background:#7c3aed;color:#fff;border:none;font-size:14px;cursor:pointer;">重新整理</button>' +
              "</div>";
            var retry = document.getElementById("ms-retry");
            if (retry) {
              retry.addEventListener("click", function () {
                // A plain location.reload() can be answered from the very
                // cache that is serving the broken page, so the button would
                // just redisplay this screen. Go through a fresh URL instead.
                sessionStorage.removeItem(RETRY_KEY);
                location.replace(
                  location.pathname + "?_r=" + Date.now() + location.hash,
                );
              });
            }
          }
        }
        check();
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
